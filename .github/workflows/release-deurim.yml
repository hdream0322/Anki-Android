name: Release (Deurim Fork)

# 트리거:
#   1) v* 형식 태그 푸시 (예: v0.1.0)  → GitHub Release 자동 생성 + APK 첨부
#   2) GitHub 웹 → Actions → "Release (Deurim Fork)" → Run workflow (수동)
#      수동 실행 시에는 Release를 만들지 않고 워크플로 Artifact로만 업로드합니다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # GitHub Release 생성용

concurrency:
  group: release-deurim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Parse fork build number from tag
        id: forkbuild
        # 태그 v0.0.X 의 마지막 숫자를 versionCode 오프셋으로 사용.
        # 수동 실행(workflow_dispatch)에선 태그가 없으므로 0 으로 fallback.
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            BUILD="${BASH_REMATCH[1]}"
          else
            BUILD="0"
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Fork build number: $BUILD"

      - name: Resolve fork release timestamp (epoch ms)
        id: forkdate
        # 태그가 가리키는 커밋의 author date 를 ms 로 환산해 About 화면에 표시.
        run: |
          SECS=$(git log -1 --format=%ct "${{ github.sha }}")
          MS=$((SECS * 1000))
          echo "ms=$MS" >> "$GITHUB_OUTPUT"
          echo "Fork release timestamp (ms): $MS"

      - name: Build full release APK (universal)
        run: |
          ./gradlew :AnkiDroid:assembleFullRelease \
            -Duniversal-apk=true \
            -PforkVersion="${{ github.ref_name }}" \
            -PforkBuild=${{ steps.forkbuild.outputs.build }} \
            -PforkReleaseDate=${{ steps.forkdate.outputs.ms }} \
            --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find AnkiDroid/build/outputs/apk/full/release -name '*-universal-release*.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find AnkiDroid/build/outputs/apk/full/release -name '*.apk' | head -1)
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
