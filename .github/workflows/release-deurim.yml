name: Release (Deurim Fork)

# 트리거:
#   1) v* 형식 태그 푸시 (예: v0.1.0)  → GitHub Release 자동 생성 + APK 첨부
#   2) GitHub 웹 → Actions → "Release (Deurim Fork)" → Run workflow (수동)
#      수동 실행 시에는 Release를 만들지 않고 워크플로 Artifact로만 업로드합니다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # GitHub Release 생성용

concurrency:
  group: release-deurim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; APK would be signed with the public fallback debug key (Play Protect / PackageInstaller rejects the resulting APK on many devices)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/deurim-release.jks"
          echo "KEYSTOREPATH=$RUNNER_TEMP/keystore/deurim-release.jks" >> "$GITHUB_ENV"

      - name: Parse fork build number from tag
        id: forkbuild
        # 태그 v0.0.X 의 마지막 숫자를 versionCode 오프셋으로 사용.
        # 수동 실행(workflow_dispatch)에선 태그가 없으므로 0 으로 fallback.
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            BUILD="${BASH_REMATCH[1]}"
          else
            BUILD="0"
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Fork build number: $BUILD"

      - name: Resolve fork release timestamp (epoch ms)
        id: forkdate
        # 태그가 가리키는 커밋의 author date 를 ms 로 환산해 About 화면에 표시.
        run: |
          SECS=$(git log -1 --format=%ct "${{ github.sha }}")
          MS=$((SECS * 1000))
          echo "ms=$MS" >> "$GITHUB_OUTPUT"
          echo "Fork release timestamp (ms): $MS"

      - name: Build full release APK (universal)
        env:
          KEYSTOREPWD: ${{ secrets.KEYSTOREPWD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYPWD: ${{ secrets.KEYPWD }}
        run: |
          ./gradlew :AnkiDroid:assembleFullRelease \
            -Duniversal-apk=true \
            -PforkVersion="${{ github.ref_name }}" \
            -PforkBuild=${{ steps.forkbuild.outputs.build }} \
            -PforkReleaseDate=${{ steps.forkdate.outputs.ms }} \
            --no-daemon

      - name: Collect & rename APKs
        id: apk
        # assembleFullRelease 는 ABI 별 split 4개 + (`-Duniversal-apk=true` 덕에) universal 1개,
        # 합 5개를 만든다. 파일명에 태그를 박아 릴리스에 모두 올린다.
        run: |
          SRC=AnkiDroid/build/outputs/apk/full/release
          OUT="$RUNNER_TEMP/release-apks"
          mkdir -p "$OUT"
          TAG="${{ github.ref_name }}"
          # 수동 실행(workflow_dispatch) 시 ref_name 은 브랜치명이므로 그대로 둬도 의미가 통함.
          shopt -s nullglob
          count=0
          for apk in "$SRC"/*.apk; do
            base=$(basename "$apk" .apk)
            # gradle outputs look like:
            #   AnkiDroid-full-arm64-v8a-release.apk
            #   AnkiDroid-full-universal-release.apk
            # → AnkiDroid-deurim-<tag>-<abi>.apk
            abi=$(echo "$base" | sed -E 's/^AnkiDroid-full-(.+)-release$/\1/')
            newname="AnkiDroid-deurim-${TAG}-${abi}.apk"
            cp "$apk" "$OUT/$newname"
            echo "  $base.apk  →  $newname"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No APKs found under $SRC"
            exit 1
          fi
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "Renamed $count APK(s) into $OUT"
          ls -la "$OUT"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiDroid-deurim-${{ github.ref_name }}-apks
          path: ${{ steps.apk.outputs.dir }}/*.apk
          if-no-files-found: error

      - name: Resolve release notes body
        id: notes
        # release-notes/<tag>.md 가 있으면 그 내용을 release body 로 쓰고,
        # 없으면 generate_release_notes 로 폴백.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES_FILE="release-notes/${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "has_body=true" >> "$GITHUB_OUTPUT"
            echo "body_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "Using $NOTES_FILE as release body"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
            echo "No $NOTES_FILE; falling back to generated notes"
          fi

      - name: Create GitHub Release with curated body
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.has_body == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.dir }}/*.apk
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          fail_on_unmatched_files: true

      - name: Create GitHub Release with generated notes
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.has_body != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.dir }}/*.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
